name: Build QDHS Grade Report Suit

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python3 test_suite.py

      - name: Build macOS .app bundle
        run: |
          pyinstaller \
            --noconfirm \
            --windowed \
            --name "QDGradeReportSuit" \
            --add-data "assets:assets" \
            main.py

      - name: Package macOS .app as zip
        run: |
          cd dist
          zip -r -y QDGradeReportSuit_macOS.zip QDGradeReportSuit.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QDGradeReportSuit
          path: dist/QDGradeReportSuit.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python test_suite.py

      - name: Build Windows .exe
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "QDGradeReportSuit" `
            --add-data "assets;assets" `
            main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QDGradeReportSuit_Windows
          path: dist/QDGradeReportSuit.exe
