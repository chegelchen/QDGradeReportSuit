name: Build QDHS Grade Report Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python3 test_suite.py

      - name: Build macOS .app bundle
        run: |
          pyinstaller \
            --noconfirm \
            --windowed \
            --name "QDHS_Grade_Report_Generator" \
            --add-data "assets:assets" \
            main.py

      - name: Package macOS .dmg (Apple Silicon)
        run: |
          mkdir -p dmg_staging
          cp -R "dist/QDHS_Grade_Report_Generator.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create \
            -volname "QDHS Grade Report Generator" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "dist/QDHS_Grade_Report_Generator_macOS_AppleSilicon.dmg"

      - name: Upload macOS Artifact (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: QDHS_Grade_Report_Generator_macOS_AppleSilicon
          path: dist/QDHS_Grade_Report_Generator_macOS_AppleSilicon.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python test_suite.py

      - name: Build Windows .exe
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "QDHS_Grade_Report_Generator" `
            --add-data "assets;assets" `
            main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QDHS_Grade_Report_Generator_Windows
          path: dist/QDHS_Grade_Report_Generator.exe
